name: Build docker image

on:
  push:
    branches:
    - master

    tags:
    - '*'
    - '!*-r[0-9]*'

env:
  MEMCACHED1: '1.6.45'
  MEMCACHED_MEMORY: 16
  MEMCACHED_THREADS: 2
  MEMCACHED_MAX_CONNECTIONS: 128

jobs:
  memcached1-build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm            
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and test
        id: build-image
        env:
          MEMCACHED_VER: ${{ env.MEMCACHED1 }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        if: github.event_name == 'push'
        uses: ./.github/actions/grype
        with:
          image: docker:${{ steps.build-image.outputs.image }}
      - name: Push scanned architecture image
        if: github.event_name == 'push'
        env:
          MEMCACHED_VER: ${{ env.MEMCACHED1 }}
          ARCH: ${{ matrix.arch }}
        run: make push
  memcached1-push:
    runs-on: ubuntu-latest
    needs:
      - memcached1-build
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ env.MEMCACHED1 }}
          latest: true
          latest_major: true

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ memcached1-push ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@6a3956567002e48847338be97b4d955ee40ae7cb
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
