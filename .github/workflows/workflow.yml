name: Build docker image

on:
  push:
    branches:
    - master

    tags:
    - '*'

env:
  MEMCACHED1: '1.6.45'
  MEMCACHED_MEMORY: 16
  MEMCACHED_THREADS: 2
  MEMCACHED_MAX_CONNECTIONS: 128

jobs:
  memcached1-build:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm            
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and test
        id: build-image
        env:
          MEMCACHED_VER: ${{ env.MEMCACHED1 }}
          ARCH: ${{ matrix.arch }}
        run: |
          make
          make test
          echo "image=$(make --no-print-directory -s image-ref)" >> "$GITHUB_OUTPUT"
      - name: Scan image
        if: github.event_name == 'push'
        uses: ./.github/actions/scout
        with:
          image: local://${{ steps.build-image.outputs.image }}
          dockerhub-user: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push scanned architecture image
        if: github.event_name == 'push'
        env:
          MEMCACHED_VER: ${{ env.MEMCACHED1 }}
          ARCH: ${{ matrix.arch }}
        run: make push
  memcached1-push:
    runs-on: ubuntu-latest
    needs:
      - memcached1-build
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: ./.github/actions
        with:
          version: ${{ env.MEMCACHED1 }}
          latest: true
          latest_major: true
